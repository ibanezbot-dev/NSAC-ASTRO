<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05081d" />
    <meta
      name="description"
      content="ASTRO - Your little big commander. Simulador espacial educativo K-12 donde gestionas una estación espacial frente a eventos reales de clima espacial de la NASA."
    />
    <title>ASTRO — Your little big commander</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230A84FF'/%3E%3Cpath d='M32 10l6.5 14 15.5 2-11.5 10.5 3 15.5L32 44l-13.5 8 3-15.5L10 26l15.5-2z' fill='%23FFD60A'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <!-- Preloader Visual Porcentual (0% - 100%) — Evita CLS y pantallas en blanco (Paso 5) -->
    <div class="astro-preloader" id="astro-preloader" role="status" aria-live="polite" aria-label="Cargando simulador ASTRO">
      <div class="astro-preloader__card glass-card">
        <div class="astro-preloader__logo">ASTRO</div>
        <div class="astro-preloader__rocket" aria-hidden="true">🚀</div>
        <p class="astro-preloader__sub">¡Preparando despegue!</p>
        <div class="astro-preloader__track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="preloader-bar">
          <div class="astro-preloader__fill" id="preloader-fill"></div>
        </div>
        <strong class="astro-preloader__pct" id="preloader-pct">0%</strong>
      </div>
    </div>

    <!-- Aviso de Orientación Horizontal (Viewport Lock amigable — Paso 5) -->
    <aside class="orientation-notice" id="orientation-notice" aria-live="polite">
      <div class="orientation-notice__card glass-card">
        <span class="orientation-notice__icon" aria-hidden="true">📱↻</span>
        <h2>¡Gira tu pantalla!</h2>
        <p>Se ve mejor así ↔️</p>
        <button type="button" class="hud-pill-btn glass-pill" id="dismiss-orientation-btn">
          Seguir así
        </button>
      </div>
    </aside>

    <div class="app-shell" id="app">
      <!-- VISTA 1: Pantalla de Inicio / Selección de Comandante (Mockup 1) -->
      <section
        id="view-start"
        class="view view--start is-active"
        aria-label="Pantalla de inicio y selección de comandante"
      ></section>

      <!-- VISTA 2: Escenario Principal de la Estación Espacial (Mockup 2 - Interfaz Diegética) -->
      <section
        id="view-station"
        class="view view--station"
        hidden
        aria-label="Estación espacial interactiva"
      ></section>
    </div>

    <!-- El modelo ML Client-Side (modelo_simulacion_espacial.js) se carga como ES module desde js/ml-bridge.js -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
